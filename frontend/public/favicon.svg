<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050716" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spiral1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="spiral2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="coreStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background sphere -->
  <circle cx="32" cy="32" r="30" fill="#060814"/>
  <circle cx="32" cy="32" r="30" fill="url(#spaceGlow)"/>
  <circle cx="32" cy="32" r="29.5" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Galaxy outer orbit rings -->
  <ellipse cx="32" cy="32" rx="24" ry="12" transform="rotate(-30 32 32)" stroke="url(#spiral1)" stroke-width="2.2" stroke-dasharray="32 10" stroke-linecap="round" opacity="0.85" filter="url(#neonGlow)"/>
  <ellipse cx="32" cy="32" rx="20" ry="9" transform="rotate(35 32 32)" stroke="url(#spiral2)" stroke-width="2" stroke-dasharray="24 8" stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)"/>

  <!-- Inner swirling nexus arms -->
  <path d="M 32 18 C 39 18 45 23 44 31 C 43 38 35 43 27 40 C 21 38 19 31 23 26 C 26 22 31 23 33 27 C 34 30 32 33 29 32" stroke="url(#spiral1)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M 32 46 C 25 46 19 41 20 33 C 21 26 29 21 37 24 C 43 26 45 33 41 38 C 38 42 33 41 31 37 C 30 34 32 31 35 32" stroke="url(#spiral2)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Star nodes (Nexus network) -->
  <circle cx="16" cy="22" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="48" cy="42" r="1.5" fill="#f43f5e" opacity="0.9"/>
  <circle cx="45" cy="19" r="1.2" fill="#c084fc" opacity="0.8"/>
  <circle cx="19" cy="45" r="1.2" fill="#06b6d4" opacity="0.8"/>
  <circle cx="28" cy="14" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="36" cy="50" r="1" fill="#ffffff" opacity="0.7"/>

  <!-- Central Supermassive Stellar Core / Starburst -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
  <!-- 4-point Diamond Star Flare -->
  <path d="M 32 20 Q 32 32 20 32 Q 32 32 32 44 Q 32 32 44 32 Q 32 32 32 20 Z" fill="url(#coreStar)" filter="url(#neonGlow)"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
</svg>
